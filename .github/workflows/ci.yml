name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与本地开发、node:sqlite 持久化基线保持一致
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (TS strict)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: E2E smoke (cloud API + SSE)
        run: |
          node server/index.mjs > /tmp/leadpilot-cloud.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5181/health >/dev/null 2>&1; then
              echo "cloud API ready after ${i}s"
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "cloud API failed to start"
            cat /tmp/leadpilot-cloud.log
            exit 1
          fi
          npm run smoke
