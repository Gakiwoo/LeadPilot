name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 与本地开发、node:sqlite 持久化基线保持一致；显式 22 避免 Node 20 弃用提示
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # 干净检出保护：.gitignore 曾因 `data/` 误排除 src/data/，本地全绿但 CI 缺模块。
      - name: Tracked sources sanity (clean checkout)
        run: |
          for f in \
            src/data/demo-data.ts src/data/repository.ts \
            src/domain/scoring.ts src/services/adapters.ts src/services/gateway-client.ts \
            src/store/useAppStore.ts src/types/index.ts \
            src/components/developer/ExecutionView.tsx src/components/settings/SettingsView.tsx \
            src/components/outreach/OutreachView.tsx src/components/outreach/BatchPipelinePanel.tsx \
            shared/model-protocol.json shared/baseline-contract.json \
            server/index.mjs server/store.mjs server/t0.mjs server/data-sources.mjs \
            server/ledger.mjs server/baseline.mjs server/eval.mjs server/protocol.mjs \
            server/gateway.mjs server/orchestrator.mjs server/batch.mjs \
            scripts/e2e-smoke.mjs scripts/verify-restart.mjs scripts/verify-restart.sh \
            scripts/check-release-gates.mjs scripts/validate-baseline.mjs \
            scripts/fixtures/invalid-baseline-sample.json; do
            git ls-files --error-unmatch "$f" > /dev/null || { echo "::error::关键源码未被 git 跟踪: $f"; exit 1; }
          done
          echo "关键源码均已纳入版本控制"

      - name: Typecheck (TS strict)
        run: npm run typecheck

      # v0.6.0：把「未标注 / 未接数据源 / 审计估值不等于扣点 / diff 与队列非占位」变成可执行断言
      - name: Release gate self-check
        run: npm run gate

      - name: Baseline import validator self-test
        run: npm run validate:baseline -- --self-test

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: E2E smoke (cloud API + SSE)
        run: |
          node server/index.mjs > /tmp/leadpilot-cloud.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5181/health >/dev/null 2>&1; then
              echo "cloud API ready after ${i}s"
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "cloud API failed to start"
            cat /tmp/leadpilot-cloud.log
            exit 1
          fi
          npm run smoke

      # AC-03：真实杀进程 → 直读 SQLite → 同库重启 → 恢复值与落盘值逐项比对 → 断点续跑
      - name: "AC-03 process restart and cursor resume"
        run: bash scripts/verify-restart.sh
