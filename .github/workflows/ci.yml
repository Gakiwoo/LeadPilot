name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 供应链：action 固定到不可变 commit SHA，避免浮动 tag 被劫持后静默换实现。
      # actions/checkout v5.1.0 / actions/setup-node v5.0.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          # 与本地开发、node:sqlite 持久化基线保持一致；显式 22 避免 Node 20 弃用提示
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # 干净检出保护：.gitignore 曾因 `data/` 误排除 src/data/，本地全绿但 CI 缺模块。
      # B3-3：不再维护 31 项硬编码清单，改为全量枚举 src/server/shared/scripts 与 git ls-files 对账。
      - name: Tracked sources sanity (clean checkout)
        run: npm run check:tracked

      - name: Typecheck (TS strict)
        run: npm run typecheck

      # v0.6.0：把「未标注 / 未接数据源 / 审计估值不等于扣点 / diff 与队列非占位」变成可执行断言
      - name: Release gate self-check
        run: npm run gate

      - name: Baseline import validator self-test
        run: npm run validate:baseline -- --self-test

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: E2E smoke (cloud API + SSE)
        run: |
          node server/index.mjs > /tmp/leadpilot-cloud.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5181/health >/dev/null 2>&1; then
              echo "cloud API ready after ${i}s"
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "cloud API failed to start"
            cat /tmp/leadpilot-cloud.log
            exit 1
          fi
          npm run smoke

      # AC-03：真实杀进程 → 直读 SQLite → 同库重启 → 恢复值与落盘值逐项比对 → 断点续跑
      - name: "AC-03 process restart and cursor resume"
        run: bash scripts/verify-restart.sh
